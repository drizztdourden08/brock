name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  gate:
    uses: drizztdourden08/standards/.github/workflows/ci.yml@v1
    permissions:
      contents: read
      packages: read
    with:
      scripts: lint lint:md structure test app:build
      sync-check: false

  upgrade:
    runs-on: windows-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@drizztdourden08'
      - run: pnpm install --frozen-lockfile
      - run: |
          git config --global user.name "brock-ci"
          git config --global user.email "brock-ci@users.noreply.github.com"
      - name: Scaffold an app with the last published create-brock
        run: |
          previous="$(npm view @drizztdourden08/create-brock version)"
          echo "Scaffolding with create-brock $previous"
          mkdir -p "$RUNNER_TEMP/prev"
          cd "$RUNNER_TEMP/prev"
          pnpm dlx "@drizztdourden08/create-brock@$previous" app --yes --install
          cd app
          if [ ! -d .git ]; then
            git init -q -b main
            git add -A
            git commit -q -m "Scaffold with create-brock $previous"
          fi
      - name: Upgrade it to this checkout
        working-directory: ${{ runner.temp }}/prev/app
        run: node "$GITHUB_WORKSPACE/packages/build/bin/brock.mjs" upgrade --local "$GITHUB_WORKSPACE"
      - name: Keep the upgrade and review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-report
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/prev/app/.worktrees/*/upgrade-report.md
            ${{ runner.temp }}/prev/app/.worktrees/*/.user-data/Data/review/
          if-no-files-found: ignore

import groovy.json.JsonSlurper

ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

def pins = new JsonSlurper().parse(file('../native/package.json'))
def sdl3PackageDir = file("../native/third_party/SDL3-${pins.sdl3}")
def sdlJavaUpstream = new File(sdl3PackageDir, 'android-project/app/src/main/java/org/libsdl/app')
def sdlJavaDir = layout.buildDirectory.dir('generated/sdl3-java').get().asFile
def inputAbis = (findProperty('brockInputAbis') ?: 'arm64-v8a').toString().split(',').collect { it.trim() }.findAll { it }
def cmakeDirExplicit = (findProperty('brockInputCmakeDir') ?: System.getenv('BROCK_INPUT_CMAKE_DIR') ?: '').toString().trim()
def cmakeDirSetting = cmakeDirExplicit ?: (System.getProperty('os.name').toLowerCase().contains('windows') ? 'temp' : '')
def cmakeDirInProject = cmakeDirSetting == 'project'
def cmakeDirBase = cmakeDirSetting == 'temp' ? new File(System.getProperty('java.io.tmpdir'), 'brock-input') : rootProject.file(cmakeDirSetting ?: '.')
def cmakeStagingDir = cmakeDirSetting && !cmakeDirInProject ? new File(cmakeDirBase, "android-${Integer.toHexString(projectDir.absolutePath.hashCode())}") : null
def sdl3ShortDir = cmakeStagingDir ? new File(cmakeDirBase, "SDL3-${pins.sdl3}") : null
def sdl3SourceDir = (sdl3ShortDir ?: sdl3PackageDir).absolutePath.replace('\\', '/')

tasks.register('fetchSdl3Source', Exec) {
    onlyIf { !new File(sdl3PackageDir, 'CMakeLists.txt').exists() }
    workingDir file('..')
    commandLine 'node', 'bin/ensure-sdl3-source.mjs'
}

tasks.register('mirrorSdl3Source', Sync) {
    dependsOn 'fetchSdl3Source'
    onlyIf { sdl3ShortDir != null }
    from sdl3PackageDir
    into sdl3ShortDir ?: layout.buildDirectory.dir('unused-sdl3').get().asFile
}

tasks.register('stageSdlJava', Copy) {
    dependsOn 'fetchSdl3Source'
    from sdlJavaUpstream
    into new File(sdlJavaDir, 'org/libsdl/app')
    doFirst {
        if (!sdlJavaUpstream.exists()) {
            throw new GradleException("No SDL3 Java sources at ${sdlJavaUpstream}. Run node bin/ensure-sdl3-source.mjs in the brock-input package.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn 'stageSdlJava'
    if (task.name =~ /CMake|externalNativeBuild|JsonModel/) task.dependsOn 'mirrorSdl3Source'
}

android {
    namespace = 'com.drizztdourden08.brock.input'
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    ndkVersion = '27.2.12479018'
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        externalNativeBuild {
            cmake {
                arguments "-DSDL3_SOURCE_DIR=${sdl3SourceDir}", '-DANDROID_STL=c++_shared'
                abiFilters(*inputAbis)
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
            if (cmakeStagingDir) buildStagingDirectory = cmakeStagingDir
        }
    }
    sourceSets {
        main {
            java.srcDirs += sdlJavaDir
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
}

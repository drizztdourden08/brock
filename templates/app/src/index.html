<!DOCTYPE html>
<!-- `booting` suppresses entrance animations until the shell has settled, so the
     window never appears partway through a fade. Removed by the shell once ready. -->
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <title>Brock App</title>
    <!-- Boot splash inside the page: painted before any script runs. React replaces
         #root on first render, so it tears itself down. On desktop the splash WINDOW
         (splash.html) covers the gap; this one covers web and mobile hosts. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #000;
      }
      #boot-splash img {
        width: 192px;
        height: 192px;
      }
      #boot-splash .boot-splash__spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #3b6fe0;
        animation: boot-splash-rotate 0.7s linear infinite;
      }
      @keyframes boot-splash-rotate {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="./logos/icon-256.png" alt="" />
        <div class="boot-splash__spinner"></div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
